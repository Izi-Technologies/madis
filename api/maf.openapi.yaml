openapi: 3.0.3
info:
  title: MADIS Application Fabric
  version: 0.7.0
  description: >-
    Language-neutral command and replayable event contract for external MADIS
    applications. The MAF HTTP routes in this document are served by the
    standalone admin process. Mutating routes durably accept commands into
    PostgreSQL and return 202; SIP-worker execution is asynchronous.
  x-madis-status: enabled-durable-command-boundary
servers:
  - url: /admin
security:
  - mafBearerAuth: []
paths:
  /api/v1/maf/calls:
    post:
      operationId: createCall
      summary: Originate a call
      security:
        - mafBearerAuth: []
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/CreateCallRequest'}}
      responses:
        '202': {description: Command accepted, content: {application/json: {schema: {$ref: '#/components/schemas/CommandReceipt'}}}}
        '401': {description: Authentication failed}
        '403': {description: Scope or tenant policy denied the command}
        '409': {description: Idempotency or resource version conflict}
        '429': {description: Rate limit exceeded}
  /api/v1/maf/calls/{call_id}:
    get:
      operationId: getCall
      summary: Read a call
      security:
        - mafBearerAuth: []
      responses:
        '200': {description: Call resource, content: {application/json: {schema: {$ref: '#/components/schemas/Call'}}}}
        '401': {description: Authentication failed}
        '403': {description: Resource policy denied the request}
        '404': {description: Call not found}
    parameters:
      - {$ref: '#/components/parameters/CallId'}
  /api/v1/maf/calls/{call_id}/answer:
    post:
      operationId: answerCall
      summary: Answer a call
      description: Answer an owned inbound ringing call with bounded SDP. This route is asynchronous; the SIP worker validates the SDP and sends the tagged 200 OK when execution succeeds.
      security:
        - mafBearerAuth: []
      parameters:
        - {$ref: '#/components/parameters/CallId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/AnswerRequest'}}
      responses:
        '202': {description: Command accepted, content: {application/json: {schema: {$ref: '#/components/schemas/CommandReceipt'}}}}
        '401': {description: Authentication failed}
        '403': {description: Scope or call policy denied the command}
        '404': {description: Call not found}
        '409': {description: Call state conflict}
  /api/v1/maf/calls/{call_id}/reject:
    post:
      operationId: rejectCall
      summary: Reject a call
      security:
        - mafBearerAuth: []
      parameters:
        - {$ref: '#/components/parameters/CallId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: false
        content:
          application/json: {schema: {$ref: '#/components/schemas/RejectCallRequest'}}
      responses:
        '202': {description: Command accepted, content: {application/json: {schema: {$ref: '#/components/schemas/CommandReceipt'}}}}
        '401': {description: Authentication failed}
        '403': {description: Scope or call policy denied the command}
        '404': {description: Call not found}
        '409': {description: Call state conflict}
  /api/v1/maf/calls/{call_id}/hangup:
    post:
      operationId: hangupCall
      summary: End a call
      security:
        - mafBearerAuth: []
      parameters:
        - {$ref: '#/components/parameters/CallId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: false
        content:
          application/json: {schema: {$ref: '#/components/schemas/CommandRequest'}}
      responses:
        '202': {description: Command accepted, content: {application/json: {schema: {$ref: '#/components/schemas/CommandReceipt'}}}}
        '401': {description: Authentication failed}
        '403': {description: Scope or call policy denied the command}
        '404': {description: Call not found}
        '409': {description: Call state conflict}
  /api/v1/maf/calls/{call_id}/bridges:
    post:
      operationId: bridgeCall
      summary: Bridge two call channels
      security:
        - mafBearerAuth: []
      parameters:
        - {$ref: '#/components/parameters/CallId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/BridgeRequest'}}
      responses:
        '202': {description: Command accepted, content: {application/json: {schema: {$ref: '#/components/schemas/CommandReceipt'}}}}
        '401': {description: Authentication failed}
        '403': {description: Scope or call policy denied the command}
        '404': {description: Call or channel not found}
        '409': {description: Call state conflict}
  /api/v1/maf/calls/{call_id}/media:
    post:
      operationId: controlMedia
      summary: Request a bounded media operation
      security:
        - mafBearerAuth: []
      parameters:
        - {$ref: '#/components/parameters/CallId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/MediaRequest'}}
      responses:
        '202': {description: Command accepted, content: {application/json: {schema: {$ref: '#/components/schemas/CommandReceipt'}}}}
        '401': {description: Authentication failed}
        '403': {description: Scope or call policy denied the command}
        '404': {description: Call not found}
        '409': {description: Call state conflict}
  /api/v1/maf/calls/{call_id}/headers:
    post:
      operationId: setCallHeaders
      summary: Set a bounded per-call SIP header policy
      description: >-
        Replace the worker-owned header policy for this call. Identity,
        framing, routing, authentication, and dialog-identity headers cannot
        be changed by the policy.
      security:
        - mafBearerAuth: []
      parameters:
        - {$ref: '#/components/parameters/CallId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/HeaderPolicyRequest'}}
      responses:
        '202': {description: Command accepted, content: {application/json: {schema: {$ref: '#/components/schemas/CommandReceipt'}}}}
        '401': {description: Authentication failed}
        '403': {description: Scope or call policy denied the command}
        '404': {description: Call not found}
        '409': {description: Call state conflict}
  /api/v1/maf/calls/{call_id}/transfer:
    post:
      operationId: transferCall
      summary: Transfer a call (blind or attended)
      security:
        - mafBearerAuth: []
      parameters:
        - {$ref: '#/components/parameters/CallId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/TransferRequest'}}
      responses:
        '202': {description: Command accepted, content: {application/json: {schema: {$ref: '#/components/schemas/CommandReceipt'}}}}
        '401': {description: Authentication failed}
        '403': {description: Scope or call policy denied the command}
        '404': {description: Call not found}
        '409': {description: Call state conflict}
  /api/v1/maf/calls/{call_id}/hold:
    post:
      operationId: holdCall
      summary: Place a call on hold
      security:
        - mafBearerAuth: []
      parameters:
        - {$ref: '#/components/parameters/CallId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: false
        content:
          application/json: {schema: {$ref: '#/components/schemas/CommandRequest'}}
      responses:
        '202': {description: Command accepted, content: {application/json: {schema: {$ref: '#/components/schemas/CommandReceipt'}}}}
        '401': {description: Authentication failed}
        '403': {description: Scope or call policy denied the command}
        '404': {description: Call not found}
        '409': {description: Call state conflict}
  /api/v1/maf/calls/{call_id}/unhold:
    post:
      operationId: unholdCall
      summary: Resume a held call
      security:
        - mafBearerAuth: []
      parameters:
        - {$ref: '#/components/parameters/CallId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: false
        content:
          application/json: {schema: {$ref: '#/components/schemas/CommandRequest'}}
      responses:
        '202': {description: Command accepted, content: {application/json: {schema: {$ref: '#/components/schemas/CommandReceipt'}}}}
        '401': {description: Authentication failed}
        '403': {description: Scope or call policy denied the command}
        '404': {description: Call not found}
        '409': {description: Call state conflict}
  /api/v1/maf/calls/{call_id}/dtmf:
    post:
      operationId: sendDtmf
      summary: Send a DTMF digit via SIP INFO
      security:
        - mafBearerAuth: []
      parameters:
        - {$ref: '#/components/parameters/CallId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/DtmfRequest'}}
      responses:
        '202': {description: Command accepted, content: {application/json: {schema: {$ref: '#/components/schemas/CommandReceipt'}}}}
        '401': {description: Authentication failed}
        '403': {description: Scope or call policy denied the command}
        '404': {description: Call not found}
        '409': {description: Call state conflict}
  /api/v1/maf/calls/{call_id}/route:
    post:
      operationId: routeCall
      summary: Route an inbound call to a target
      description: >-
        SDK-controlled routing for inbound calls. Bypasses the built-in routing
        engine and forwards the cached INVITE to the specified SIP URI. Requires
        SIP_MAF_INBOUND_MODE=control or route.
      security:
        - mafBearerAuth: []
      parameters:
        - {$ref: '#/components/parameters/CallId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/RouteRequest'}}
      responses:
        '202': {description: Command accepted, content: {application/json: {schema: {$ref: '#/components/schemas/CommandReceipt'}}}}
        '401': {description: Authentication failed}
        '403': {description: Scope or call policy denied the command}
        '404': {description: Call not found}
        '409': {description: Call state conflict}
  /api/v1/maf/calls/{call_id}/rtp:
    post:
      operationId: rtpControl
      summary: Control RTPEngine media relay
      description: >-
        Direct RTPEngine ng-protocol control. The SDK can trigger offer, answer,
        delete, or query with per-call flag overrides (ICE, SRTP, DTLS, codec
        strip, etc.). The rewritten SDP is cached for retrieval.
      security:
        - mafBearerAuth: []
      parameters:
        - {$ref: '#/components/parameters/CallId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/RtpRequest'}}
      responses:
        '202': {description: Command accepted, content: {application/json: {schema: {$ref: '#/components/schemas/CommandReceipt'}}}}
        '401': {description: Authentication failed}
        '403': {description: Scope or call policy denied the command}
        '404': {description: Call not found}
        '409': {description: Call state conflict}
  /api/v1/maf/events:
    get:
      operationId: listEvents
      summary: Read replayable MAF events
      description: >-
        The HTTP form is for bounded replay and recovery. Live subscriptions
        use the bearer-authenticated WebSocket route
        `/api/v1/maf/events/ws`.
      security:
        - mafBearerAuth: []
      parameters:
        - {name: cursor, in: query, schema: {type: string, maxLength: 256}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 100}}
        - {name: event_type, in: query, schema: {type: string, minLength: 1, maxLength: 128}}
        - {name: call_id, in: query, description: Scope the subscription to a single call, schema: {type: string, minLength: 1, maxLength: 128}}
      responses:
        '200': {description: Event page, content: {application/json: {schema: {$ref: '#/components/schemas/EventPage'}}}}
        '401': {description: Authentication failed}
        '403': {description: Subscription policy denied the request}
  /api/v1/maf/events/ws:
    get:
      operationId: subscribeEvents
      summary: WebSocket event subscription (RFC 7118 compatible)
      description: >-
        Bearer-authenticated WebSocket upgrade. Echoes Sec-WebSocket-Protocol: sip.
        Each text frame is a JSON event page. Supports call_id and event_type
        filters. Adaptive poll with 30s heartbeat. Resume from next_cursor
        on reconnect.
      security: [{mafBearerAuth: []}]
      parameters:
        - {name: cursor, in: query, schema: {type: string}}
        - {name: event_type, in: query, schema: {type: string, maxLength: 128}}
        - {name: call_id, in: query, schema: {type: string, maxLength: 128}}
      responses:
        '101': {description: WebSocket upgrade successful}
        '401': {description: Authentication failed}
  /api/v1/maf/events:
    post:
      operationId: publishEvent
      summary: Publish a custom application event
      description: Custom events must use the app. prefix. Write scope required.
      security: [{mafBearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event_type]
              properties:
                event_type: {type: string, minLength: 5, maxLength: 128, pattern: '^app\.'}
                call_id: {type: string, maxLength: 128}
                payload: {type: string, maxLength: 65536}
      responses:
        '201': {description: Event published}
        '401': {description: Authentication failed}
        '403': {description: Write scope required}
  /api/v1/maf/calls/{call_id}/sip:
    get:
      operationId: sipInspect
      summary: Inspect SIP message details for a call
      security: [{mafBearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/CallId'}]
      responses:
        '200': {description: SIP details}
        '404': {description: Call not found}
  /api/v1/maf/calls/{call_id}/charge:
    post:
      operationId: chargeAuthorize
      summary: Authorize a charge for a call
      security: [{mafBearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/CallId'}]
      responses:
        '200': {description: Charge authorized}
  /api/v1/maf/calls/{call_id}/charge-deny:
    post:
      operationId: chargeDeny
      summary: Deny a charge for a call
      security: [{mafBearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/CallId'}]
      responses:
        '200': {description: Charge denied}
  /api/v1/maf/registrations:
    get:
      operationId: listRegistrations
      summary: List active SIP registrations
      security: [{mafBearerAuth: []}]
      parameters:
        - {name: aor, in: query, schema: {type: string, maxLength: 512}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 100}}
      responses:
        '200': {description: Registration list}
  /api/v1/maf/presence:
    get:
      operationId: listPresence
      summary: List online users
      security: [{mafBearerAuth: []}]
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 100}}
      responses:
        '200': {description: Presence list}
  /api/v1/maf/presence/{aor}:
    get:
      operationId: getPresence
      summary: Get presence for a specific user
      security: [{mafBearerAuth: []}]
      parameters:
        - {name: aor, in: path, required: true, schema: {type: string, maxLength: 512}}
      responses:
        '200': {description: User presence}
  /api/v1/maf/cdr:
    get:
      operationId: listCDR
      summary: List call detail records
      security: [{mafBearerAuth: []}]
      parameters:
        - {name: call_id, in: query, schema: {type: string, maxLength: 512}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      responses:
        '200': {description: CDR list}
  /api/v1/maf/security/bans:
    get:
      operationId: listBans
      summary: List active IP bans
      security: [{mafBearerAuth: []}]
      responses:
        '200': {description: Ban list}
    post:
      operationId: banIP
      summary: Ban an IP address
      security: [{mafBearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_ip]
              properties:
                source_ip: {type: string, maxLength: 128}
                reason: {type: string, maxLength: 512}
                permanent: {type: string, enum: ["true", "false"], default: "false"}
                duration_min: {type: integer, minimum: 1, maximum: 10080, default: 60}
      responses:
        '201': {description: IP banned}
  /api/v1/maf/security/bans/{source_ip}:
    delete:
      operationId: unbanIP
      summary: Remove an IP ban
      security: [{mafBearerAuth: []}]
      parameters:
        - {name: source_ip, in: path, required: true, schema: {type: string, maxLength: 128}}
      responses:
        '200': {description: Ban removed}
  /api/v1/maf/routing/rules:
    get:
      operationId: listRoutingRules
      summary: List routing rules
      security: [{mafBearerAuth: []}]
      responses:
        '200': {description: Routing rules list}
    post:
      operationId: createRoutingRule
      summary: Create a routing rule
      security: [{mafBearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                match_prefix: {type: string, maxLength: 64}
                match_caller: {type: string, maxLength: 64}
                match_src_ip: {type: string, maxLength: 128}
                match_time_start: {type: string, maxLength: 5}
                match_time_end: {type: string, maxLength: 5}
                match_day: {type: string, maxLength: 32}
                action: {type: string, maxLength: 512}
                priority: {type: integer, minimum: 1, maximum: 9999, default: 10}
                description: {type: string, maxLength: 512}
      responses:
        '201': {description: Rule created}
  /api/v1/maf/routing/rules/{rule_id}:
    delete:
      operationId: deleteRoutingRule
      summary: Delete a routing rule
      security: [{mafBearerAuth: []}]
      parameters:
        - {name: rule_id, in: path, required: true, schema: {type: integer}}
      responses:
        '200': {description: Rule deleted}
  /api/v1/maf/gateways:
    get:
      operationId: listGateways
      summary: List gateways
      security: [{mafBearerAuth: []}]
      responses:
        '200': {description: Gateway list}
    post:
      operationId: createGateway
      summary: Create or update a gateway
      security: [{mafBearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, address]
              properties:
                name: {type: string, minLength: 1, maxLength: 128}
                address: {type: string, minLength: 1, maxLength: 256}
                port: {type: integer, minimum: 1, maximum: 65535, default: 5060}
                transport: {type: string, enum: [UDP, TCP, TLS], default: UDP}
      responses:
        '201': {description: Gateway created}
  /api/v1/maf/dids:
    get:
      operationId: listDIDs
      summary: List DID numbers
      security: [{mafBearerAuth: []}]
      responses:
        '200': {description: DID list}
    post:
      operationId: createDID
      summary: Create or update a DID mapping
      security: [{mafBearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [number, destination_user]
              properties:
                number: {type: string, minLength: 1, maxLength: 64}
                destination_user: {type: string, minLength: 1, maxLength: 128}
                description: {type: string, maxLength: 512}
      responses:
        '201': {description: DID created}
  /api/v1/maf/dids/{did_id}:
    delete:
      operationId: deleteDID
      summary: Delete a DID
      security: [{mafBearerAuth: []}]
      parameters:
        - {name: did_id, in: path, required: true, schema: {type: integer}}
      responses:
        '200': {description: DID deleted}
  /api/v1/maf/gateways/{gateway_id}:
    delete:
      operationId: deleteGateway
      summary: Delete a gateway
      security: [{mafBearerAuth: []}]
      parameters:
        - {name: gateway_id, in: path, required: true, schema: {type: integer}}
      responses:
        '200': {description: Gateway deleted}
  /api/v1/maf/dispatch-sets:
    get:
      operationId: listDispatchSets
      summary: List dispatch sets with members
      security: [{mafBearerAuth: []}]
      responses:
        '200': {description: Dispatch set list}
    post:
      operationId: createDispatchSet
      summary: Create a dispatch set
      security: [{mafBearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, minLength: 1, maxLength: 128}
                algorithm: {type: string, enum: [round-robin, weight, priority, hash, hash-user, broadcast], default: round-robin}
      responses:
        '201': {description: Dispatch set created}
  /api/v1/maf/cluster:
    get:
      operationId: listClusterNodes
      summary: List cluster node health
      security: [{mafBearerAuth: []}]
      responses:
        '200': {description: Cluster node list}
  /api/v1/maf/config:
    get:
      operationId: listConfig
      summary: Read runtime configuration
      security: [{mafBearerAuth: []}]
      responses:
        '200': {description: Config key list}
    post:
      operationId: setConfig
      summary: Set a configuration value
      description: Only allowlisted keys (rtpengine_*, security_*, select stir_shaken_*) can be set via MAF.
      security: [{mafBearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, value]
              properties:
                key: {type: string, minLength: 1, maxLength: 128}
                value: {type: string, maxLength: 4096}
                description: {type: string, maxLength: 512}
      responses:
        '200': {description: Config updated}
        '403': {description: Key not in MAF allowlist}
  /api/v1/maf/dialplans:
    get:
      operationId: listDialplans
      summary: List dialplans
      security: [{mafBearerAuth: []}]
      responses:
        '200': {description: Dialplan list}
    post:
      operationId: createDialplan
      summary: Create a dialplan
      security: [{mafBearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, minLength: 1, maxLength: 128}
                match_prefix: {type: string, maxLength: 64}
                strip_digits: {type: integer, minimum: 0, maximum: 32}
                prepend: {type: string, maxLength: 64}
                description: {type: string, maxLength: 512}
      responses:
        '201': {description: Dialplan created}
  /api/v1/maf/dialplans/{dialplan_id}:
    delete:
      operationId: deleteDialplan
      summary: Delete a dialplan
      security: [{mafBearerAuth: []}]
      parameters:
        - {name: dialplan_id, in: path, required: true, schema: {type: integer}}
      responses:
        '200': {description: Dialplan deleted}
  /api/v1/maf/ip-auth:
    get:
      operationId: listIPAuth
      summary: List IP auth entries
      security: [{mafBearerAuth: []}]
      responses:
        '200': {description: IP auth list}
    post:
      operationId: createIPAuth
      summary: Create an IP auth entry
      security: [{mafBearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ip]
              properties:
                ip: {type: string, minLength: 1, maxLength: 128}
                description: {type: string, maxLength: 512}
      responses:
        '201': {description: IP auth entry created}
  /api/v1/maf/ip-auth/{ip_auth_id}:
    delete:
      operationId: deleteIPAuth
      summary: Delete an IP auth entry
      security: [{mafBearerAuth: []}]
      parameters:
        - {name: ip_auth_id, in: path, required: true, schema: {type: integer}}
      responses:
        '200': {description: IP auth entry deleted}
  /api/v1/maf/access-control:
    get:
      operationId: listAccessControl
      summary: List access control entries
      security: [{mafBearerAuth: []}]
      responses:
        '200': {description: Access control list}
    post:
      operationId: createAccessControl
      summary: Create an access control entry
      security: [{mafBearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rule, source]
              properties:
                rule: {type: string, enum: [allow, deny]}
                source: {type: string, minLength: 1, maxLength: 256}
                description: {type: string, maxLength: 512}
      responses:
        '201': {description: ACL entry created}
  /api/v1/maf/header-rules:
    get:
      operationId: listHeaderRules
      summary: List global header rules
      security: [{mafBearerAuth: []}]
      responses:
        '200': {description: Header rules list}
    post:
      operationId: createHeaderRule
      summary: Create a global header rule
      security: [{mafBearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, name]
              properties:
                action: {type: string, enum: [add, set, remove, rename, copy, move]}
                name: {type: string, minLength: 1, maxLength: 128}
                value: {type: string, maxLength: 4096}
                direction: {type: string, enum: [inbound, outbound, both], default: both}
      responses:
        '201': {description: Header rule created}
  /api/v1/maf/billing/events:
    get:
      operationId: listBillingEvents
      summary: List pending billing events
      security: [{mafBearerAuth: []}]
      responses:
        '200': {description: Billing event list}
  /api/v1/maf/billing/events/ack:
    post:
      operationId: ackBillingEvent
      summary: Acknowledge billing events
      security: [{mafBearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event_ids]
              properties:
                event_ids:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: {type: string, maxLength: 128}
      responses:
        '200': {description: Events acknowledged}
  /api/v1/maf/security/events:
    get:
      operationId: listSecurityEvents
      summary: List security audit events
      security: [{mafBearerAuth: []}]
      responses:
        '200': {description: Security event list}
  /api/v1/maf/ani-groups:
    get:
      operationId: listANIGroups
      summary: List ANI groups
      security: [{mafBearerAuth: []}]
      responses:
        '200': {description: ANI group list}
    post:
      operationId: createANIGroup
      summary: Create an ANI group
      security: [{mafBearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, numbers]
              properties:
                name: {type: string, minLength: 1, maxLength: 128}
                numbers:
                  type: array
                  minItems: 1
                  maxItems: 1000
                  items: {type: string, maxLength: 64}
      responses:
        '201': {description: ANI group created}
  /api/v1/maf/calls/active:
    get:
      operationId: listActiveCalls
      summary: List active (non-ended) calls
      security: [{mafBearerAuth: []}]
      responses:
        '200': {description: Active call list}
  /api/v1/maf/dispatch-members:
    post:
      operationId: createDispatchMember
      summary: Add a gateway to a dispatch set
      security: [{mafBearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dispatch_set_id, gateway_id]
              properties:
                dispatch_set_id: {type: integer}
                gateway_id: {type: integer}
                weight: {type: integer, minimum: 1, maximum: 1000, default: 100}
                priority: {type: integer, minimum: 1, maximum: 9999, default: 1}
      responses:
        '201': {description: Dispatch member added}
  /api/v1/maf/calls/{call_id}/identity:
    post:
      operationId: identityControl
      summary: STIR/SHAKEN identity control for external signing
      description: >-
        SDK-controlled STIR/SHAKEN for external vendors (TransNexus, Neustar,
        Iconectiv). Sign attaches a pre-signed header. Verify returns
        verification result. Attest sets attestation level. Clear removes
        headers.
      security: [{mafBearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/CallId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: {type: string, enum: [sign, verify, attest, clear]}
                identity: {type: string, maxLength: 4096}
                attest: {type: string, enum: [A, B, C]}
      responses:
        '202': {description: Command accepted}
        '401': {description: Authentication failed}
        '404': {description: Call not found}
components:
  securitySchemes:
    mafBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-or-jwt
      description: >-
        MAF credential enforced by the admin process. The current deployment
        contract uses separate read and write credentials; an edge identity
        proxy may issue short-lived credentials after validating issuer,
        audience, expiry, mTLS identity, and application policy.
  parameters:
    CallId:
      name: call_id
      in: path
      required: true
      schema: {type: string, minLength: 8, maxLength: 128}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Required unless the JSON body supplies command_id.
      schema: {type: string, minLength: 8, maxLength: 128}
  schemas:
    CommandRequest:
      type: object
      additionalProperties: false
      properties:
      command_id: {type: string, minLength: 8, maxLength: 128}
      expected_version: {type: string, maxLength: 64}
      reason: {type: string, maxLength: 512}
    AnswerRequest:
      type: object
      additionalProperties: false
      required: [answer_sdp]
      properties:
        command_id: {type: string, minLength: 8, maxLength: 128}
        expected_version: {type: string, maxLength: 64}
        answer_sdp: {type: string, minLength: 8, maxLength: 32768}
    CreateCallRequest:
      allOf:
        - {$ref: '#/components/schemas/CommandRequest'}
        - type: object
          required: [from, to]
          properties:
            tenant_id: {type: string, maxLength: 128}
            from: {type: string, minLength: 1, maxLength: 512}
            to: {type: string, minLength: 1, maxLength: 512}
            application_data: {type: object, additionalProperties: true}
    RejectCallRequest:
      allOf:
        - {$ref: '#/components/schemas/CommandRequest'}
        - type: object
          properties:
            sip_code: {type: integer, minimum: 300, maximum: 699, default: 603}
    BridgeRequest:
      allOf:
        - {$ref: '#/components/schemas/CommandRequest'}
        - type: object
          required: [channel_ids]
          properties:
            channel_ids:
              type: array
              minItems: 2
              maxItems: 8
              items: {type: string, minLength: 8, maxLength: 128}
            mode: {type: string, enum: [bridge, conference], default: bridge}
    MediaRequest:
      allOf:
        - {$ref: '#/components/schemas/CommandRequest'}
        - type: object
          required: [operation]
          properties:
            operation: {type: string, enum: [play, record, stop, pause, resume]}
            resource: {type: string, maxLength: 2048}
    HeaderPolicyRequest:
      allOf:
        - {$ref: '#/components/schemas/CommandRequest'}
        - type: object
          required: [headers]
          properties:
            headers:
              type: array
              minItems: 1
              maxItems: 32
              items: {$ref: '#/components/schemas/HeaderPolicy'}
    HeaderPolicy:
      type: object
      additionalProperties: false
      required: [action, name]
      properties:
        method: {type: string, enum: ["*", INVITE, ACK, BYE, CANCEL, UPDATE, PRACK, REFER, NOTIFY, INFO, MESSAGE, OPTIONS, REGISTER]}
        direction: {type: string, enum: [inbound, outbound, both], default: both}
        action: {type: string, enum: [add, set, remove, rename, copy, move]}
        name: {type: string, minLength: 1, maxLength: 128}
        value: {type: string, maxLength: 4096}
        target: {type: string, maxLength: 128}
    TransferRequest:
      allOf:
        - {$ref: '#/components/schemas/CommandRequest'}
        - type: object
          required: [target, type]
          properties:
            target: {type: string, minLength: 1, maxLength: 512}
            type: {type: string, enum: [blind, attended]}
            other_call_id: {type: string, minLength: 8, maxLength: 128, description: Required for attended transfer}
    DtmfRequest:
      allOf:
        - {$ref: '#/components/schemas/CommandRequest'}
        - type: object
          required: [digit]
          properties:
            digit: {type: string, minLength: 1, maxLength: 1, pattern: '^[0-9*#A-Da-d]$'}
            duration: {type: integer, minimum: 50, maximum: 5000, default: 250}
    RouteRequest:
      allOf:
        - {$ref: '#/components/schemas/CommandRequest'}
        - type: object
          required: [target]
          properties:
            target: {type: string, minLength: 1, maxLength: 512, description: SIP URI to route the call to}
            transport: {type: string, enum: [udp, tcp, tls, wss], description: Override outbound transport}
    RtpRequest:
      allOf:
        - {$ref: '#/components/schemas/CommandRequest'}
        - type: object
          required: [action]
          properties:
            action: {type: string, enum: [offer, answer, delete, query]}
            sdp: {type: string, maxLength: 32768, description: Required for offer/answer}
            from_tag: {type: string, maxLength: 256, description: Required for offer/answer}
            to_tag: {type: string, maxLength: 256, description: Required for answer}
            flags: {type: string, maxLength: 512, description: RTPEngine ng-protocol flags override}
    CommandReceipt:
      type: object
      required: [schema, command_id, status, trace_id]
      properties:
        schema: {type: string, enum: [madis.maf.command-receipt.v1]}
        command_id: {type: string}
        status: {type: string, enum: [accepted, completed, failed]}
        resource_id: {type: string}
        trace_id: {type: string}
        error_code: {type: string}
        error_message: {type: string}
    Call:
      type: object
      required: [schema, call_id, state, version]
      properties:
        schema: {type: string, enum: [madis.maf.call.v1]}
        call_id: {type: string}
        tenant_id: {type: string}
        state: {type: string, enum: [created, ringing, answered, bridged, transferring, ending, ended, failed]}
        version: {type: string}
        channels: {type: array, items: {$ref: '#/components/schemas/Channel'}}
        bridges: {type: array, items: {$ref: '#/components/schemas/Bridge'}}
        media: {type: array, items: {$ref: '#/components/schemas/MediaOperation'}}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    Channel:
      type: object
      required: [channel_id, state]
      properties:
        channel_id: {type: string}
        state: {type: string, enum: [created, ringing, answered, held, ended]}
        direction: {type: string, enum: [inbound, outbound]}
        endpoint: {type: string, maxLength: 512}
    Bridge:
      type: object
      required: [bridge_id, channel_ids, state]
      properties:
        bridge_id: {type: string}
        channel_ids: {type: array, minItems: 2, maxItems: 8, items: {type: string}}
        state: {type: string, enum: [active, ended, failed]}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    MediaOperation:
      type: object
      required: [media_id, operation, state]
      properties:
        media_id: {type: string}
        operation: {type: string, enum: [play, record, stop, pause, resume]}
        resource: {type: string, maxLength: 2048}
        state: {type: string, enum: [accepted, processing, completed, failed]}
        error_code: {type: string}
        error_message: {type: string}
    Event:
      type: object
      required: [schema, event_id, event_type, event_version, sequence, occurred_at, payload]
      properties:
        schema: {type: string, enum: [madis.maf.event.v1]}
        event_id: {type: string}
        event_type: {type: string, maxLength: 128}
        event_version: {type: integer, minimum: 1}
        tenant_id: {type: string}
        call_id: {type: string}
        channel_id: {type: string}
        sequence: {type: integer, minimum: 1}
        occurred_at: {type: string, format: date-time}
        trace_id: {type: string}
        payload: {type: object, additionalProperties: true}
    EventPage:
      type: object
      required: [schema, events, next_cursor, truncated]
      properties:
        schema: {type: string, enum: [madis.maf.event-page.v1]}
        events: {type: array, items: {$ref: '#/components/schemas/Event'}}
        next_cursor: {type: string}
        truncated: {type: boolean}
        heartbeat: {type: boolean, description: Present and true on keepalive frames with no events}
