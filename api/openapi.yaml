openapi: 3.0.3
info:
  title: Madis Carrier Integration API
  version: 1.0.0
  description: >-
    Versioned JSON outbox plus RFC 8506 charging and selected 3GPP Cx/Sh
    integration boundaries. Madis is not a rating engine, HSS, complete IMS
    core, or SS7 stack.
servers:
  - url: /admin
security:
  - bearerAuth: []
paths:
  /api/v1/capabilities:
    get:
      operationId: capabilities
      summary: Discover enabled integration contracts
      responses:
        '200': {description: Runtime capabilities}
        '401': {description: Missing or invalid carrier bearer token}
  /api/v1/billing/events:
    get:
      operationId: pendingEvents
      summary: Read undelivered billing events
      description: Process and commit each event, deduplicate by event_id, then acknowledge it.
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100}}
      responses:
        '200': {description: Pending events}
        '401': {description: Missing or invalid carrier bearer token}
        '503': {description: Database unavailable}
    post:
      operationId: publishEvent
      summary: Publish an idempotent billing event
      description: >-
        event_id should be supplied by the caller and be reused across
        retries. The current server derives a SHA-256 event_id when it is
        omitted, but portable clients should follow billing-event.schema.json
        and send one explicitly.
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/BillingEvent'}}
      responses:
        '202': {description: Accepted idempotently}
        '400': {description: Invalid JSON event or content type}
        '401': {description: Missing or invalid carrier bearer token}
        '503': {description: Database unavailable}
  /api/v1/billing/events/ack:
    post:
      operationId: acknowledgeEvent
      summary: Mark a billing event delivered
      parameters:
        - {name: event_id, in: query, required: true, schema: {type: string}}
      responses:
        '200': {description: Acknowledged}
        '400': {description: Invalid event_id}
        '401': {description: Missing or invalid carrier bearer token}
        '503': {description: Database unavailable}
  /api/v1/billing/cdr:
    get:
      operationId: billingCdr
      summary: Read bounded call detail records
      description: >-
        Read CDR fields for rating, reconciliation, reporting, or an external
        billing system. Use call_id for an exact lookup. This endpoint does not
        change billing state.
      security: [{bearerAuth: []}]
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100}}
        - {name: call_id, in: query, schema: {type: string, maxLength: 512}}
      responses:
        '200':
          description: CDR records
          content:
            application/json:
              schema:
                type: object
                required: [schema, records, truncated]
                properties:
                  schema: {type: string}
                  records:
                    type: array
                    items: {$ref: '#/components/schemas/CdrRecord'}
                  truncated: {type: boolean}
        '400': {description: Invalid call_id filter}
        '401': {description: Missing or invalid carrier bearer token}
        '503': {description: Database unavailable}
  /api/v1/control/status:
    get:
      operationId: controlStatus
      summary: Read the bounded runtime control surface
      description: Requires SIP_CONTROL_API_TOKEN or the read-only SIP_CONTROL_API_READ_TOKEN.
      security:
        - controlBearerAuth: []
        - controlReadBearerAuth: []
      responses:
        '200': {description: Control capabilities and B2BUA mode}
        '401': {description: Missing or invalid control bearer token}
  /api/v1/control/routing-rules:
    get:
      operationId: routingRules
      summary: List routing rules
      security:
        - controlBearerAuth: []
        - controlReadBearerAuth: []
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100}}
      responses:
        '200': {description: Routing rules}
        '401': {description: Missing or invalid control bearer token}
        '503': {description: Database unavailable}
    post:
      operationId: createRoutingRule
      summary: Create an allowlisted routing rule
      security: [{controlBearerAuth: []}]
      description: >-
        The action is limited to Madis routing actions such as route, b2bua,
        dispatch, reject, redirect, failover, lcr, and continue. This endpoint
        does not execute code or accept SQL.
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/RoutingRuleInput'}}
      responses:
        '201': {description: Rule created}
        '400': {description: Invalid rule or content type}
        '401': {description: Missing or invalid control bearer token}
        '503': {description: Database unavailable}
  /api/v1/control/routing-rules/{id}/{state}:
    post:
      operationId: setRoutingRuleState
      summary: Enable or disable a routing rule
      security: [{controlBearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, minimum: 1}}
        - {name: state, in: path, required: true, schema: {type: string, enum: [enable, disable]}}
      responses:
        '200': {description: Rule state changed}
        '401': {description: Missing or invalid control bearer token}
        '404': {description: Rule not found}
        '503': {description: Database unavailable}
  /api/v1/control/dialplans:
    get:
      operationId: dialplans
      summary: List dialplan rules
      security:
        - controlBearerAuth: []
        - controlReadBearerAuth: []
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100}}
      responses:
        '200':
          description: Dialplan rules
          content:
            application/json:
              schema:
                type: object
                required: [schema, dialplans, truncated]
                properties:
                  schema: {type: string}
                  dialplans:
                    type: array
                    items: {$ref: '#/components/schemas/Dialplan'}
                  truncated: {type: boolean}
        '401': {description: Missing or invalid control bearer token}
        '503': {description: Database unavailable}
    post:
      operationId: createDialplan
      summary: Create a number transformation rule
      security: [{controlBearerAuth: []}]
      description: >-
        The callee_action and caller_action values use the existing dialplan
        operations: strip, prepend, replace, set, e164, strip_plus, and
        add_plus. Multiple actions are separated by semicolons.
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/DialplanInput'}}
      responses:
        '201': {description: Dialplan rule created}
        '400': {description: Invalid dialplan or content type}
        '401': {description: Missing or invalid control bearer token}
        '503': {description: Database unavailable}
  /api/v1/control/dialplans/{id}/{state}:
    post:
      operationId: setDialplanState
      summary: Enable or disable a dialplan rule
      security: [{controlBearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, minimum: 1}}
        - {name: state, in: path, required: true, schema: {type: string, enum: [enable, disable]}}
      responses:
        '200': {description: Dialplan state changed}
        '401': {description: Missing or invalid control bearer token}
        '404': {description: Dialplan rule not found}
        '503': {description: Database unavailable}
  /api/v1/control/dialplans/{id}:
    put:
      operationId: updateDialplan
      summary: Replace a dialplan rule
      security: [{controlBearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, minimum: 1}}
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/DialplanInput'}}
      responses:
        '200': {description: Dialplan rule updated}
        '400': {description: Invalid dialplan or content type}
        '401': {description: Missing or invalid control bearer token}
        '404': {description: Dialplan rule not found}
        '503': {description: Database unavailable}
    delete:
      operationId: deleteDialplan
      summary: Delete a dialplan rule
      security: [{controlBearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, minimum: 1}}
      responses:
        '200': {description: Dialplan rule deleted}
        '401': {description: Missing or invalid control bearer token}
        '404': {description: Dialplan rule not found}
        '503': {description: Database unavailable}
  /api/v1/control/validate/routing-rule:
    post:
      operationId: validateRoutingRule
      summary: Validate a routing rule without storing it
      security:
        - controlBearerAuth: []
        - controlReadBearerAuth: []
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/RoutingRuleInput'}}
      responses:
        '200': {description: Validation result}
        '400': {description: Invalid content type or body framing}
        '401': {description: Missing or invalid control bearer token}
  /api/v1/control/validate/dialplan:
    post:
      operationId: validateDialplan
      summary: Validate a dialplan without storing it
      security:
        - controlBearerAuth: []
        - controlReadBearerAuth: []
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/DialplanInput'}}
      responses:
        '200': {description: Validation result}
        '400': {description: Invalid content type or body framing}
        '401': {description: Missing or invalid control bearer token}
  /api/v1/control/resources/{resource}:
    get:
      operationId: listControlResource
      summary: List an allowlisted Madis resource
      security:
        - controlBearerAuth: []
        - controlReadBearerAuth: []
      parameters:
        - {$ref: '#/components/parameters/ControlResource'}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100}}
      responses:
        '200': {description: Resource document with items and truncated flag}
        '401': {description: Missing or invalid control bearer token}
        '503': {description: Database unavailable}
    post:
      operationId: createControlResource
      summary: Create an allowlisted Madis resource
      security: [{controlBearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/ControlResource'}
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/ControlResourceDocument'}}
      responses:
        '201': {description: Resource created}
        '400': {description: Invalid resource document or content type}
        '401': {description: Missing or invalid write-capable control token}
        '503': {description: Database unavailable}
  /api/v1/control/resources/{resource}/{id}:
    put:
      operationId: updateControlResource
      summary: Replace an allowlisted Madis resource
      security: [{controlBearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/ControlResource'}
        - {name: id, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 128, description: Numeric row ID; source_ip for security-bans}}
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/ControlResourceDocument'}}
      responses:
        '200': {description: Resource updated}
        '400': {description: Invalid resource document or content type}
        '401': {description: Missing or invalid write-capable control token}
        '404': {description: Resource not found}
        '409': {description: expected_revision did not match}
        '503': {description: Database unavailable}
    delete:
      operationId: deleteControlResource
      summary: Delete an allowlisted Madis resource
      security: [{controlBearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/ControlResource'}
        - {name: id, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 128, description: Numeric row ID; source_ip for security-bans}}
        - {name: expected_revision, in: query, schema: {type: string, maxLength: 64}}
      responses:
        '200': {description: Resource deleted}
        '400': {description: Invalid resource identifier}
        '401': {description: Missing or invalid write-capable control token}
        '404': {description: Resource not found}
        '409': {description: expected_revision did not match}
        '503': {description: Database unavailable}
  /api/v1/control/resources/{resource}/{id}/{state}:
    post:
      operationId: setControlResourceState
      summary: Enable or disable an allowlisted Madis resource
      security: [{controlBearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/ControlResource'}
        - {name: id, in: path, required: true, schema: {type: integer, minimum: 1}}
        - {name: state, in: path, required: true, schema: {type: string, enum: [enable, disable]}}
      responses:
        '200': {description: Resource state changed}
        '400': {description: Invalid resource state}
        '401': {description: Missing or invalid write-capable control token}
        '404': {description: Resource not found}
        '503': {description: Database unavailable}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer}
    controlBearerAuth: {type: http, scheme: bearer, description: SIP_CONTROL_API_TOKEN}
    controlReadBearerAuth: {type: http, scheme: bearer, description: SIP_CONTROL_API_READ_TOKEN; read-only control calls}
  parameters:
    ControlResource:
      name: resource
      in: path
      required: true
      schema:
        type: string
        enum: [gateways, routes, dispatch-sets, dispatch-members, dids, header-rules, access-control, security-bans, ani-groups, ani-ranges, registrations, registration-bindings, cluster-nodes, security-events]
  schemas:
    BillingEvent:
      type: object
      required: [schema, event_type, data]
      additionalProperties: true
      properties:
        schema: {type: string, minLength: 1, maxLength: 512}
        event_id: {type: string, minLength: 16, maxLength: 128}
        tenant_id: {type: string}
        session_id: {type: string}
        data: {type: object, additionalProperties: true}
        extensions: {type: object, additionalProperties: true}
    CdrRecord:
      $ref: 'cdr.schema.json'
    DialplanInput:
      type: object
      required: [match_prefix, callee_action, direction]
      additionalProperties: false
      properties:
        match_prefix: {type: string, minLength: 1, maxLength: 256}
        callee_action: {type: string, minLength: 1, maxLength: 512}
        caller_action: {type: string, maxLength: 512}
        direction: {type: string, enum: [inbound, outbound]}
        priority: {type: integer, minimum: 0, maximum: 100000, default: 10}
        description: {type: string, maxLength: 512}
    Dialplan:
      allOf:
        - {$ref: '#/components/schemas/DialplanInput'}
        - type: object
          required: [id, enabled]
          properties:
            id: {type: integer, minimum: 1}
            enabled: {type: boolean}
    RoutingRuleInput:
      type: object
      required: [action]
      additionalProperties: false
      properties:
        match_prefix: {type: string, maxLength: 256}
        match_caller: {type: string, maxLength: 256}
        match_src_ip: {type: string, maxLength: 128}
        match_time_start: {type: string, maxLength: 16}
        match_time_end: {type: string, maxLength: 16}
        match_day: {type: string, maxLength: 32}
        action: {type: string, maxLength: 512, example: 'b2bua:carrier-gateway'}
        priority: {type: integer, minimum: 0, maximum: 100000, default: 10}
        description: {type: string, maxLength: 512}
    ControlResourceDocument:
      type: object
      description: >-
        Resource-specific fields are documented in api/README.md. Additional
        application fields are ignored by Madis and must be stored by the
        caller in its own database.
      additionalProperties: true
