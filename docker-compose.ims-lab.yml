services:
  hss:
    build:
      context: .
      dockerfile: docker/ims-lab/Dockerfile.hss
    networks:
      ims-lab:
        ipv4_address: 172.30.0.2
    volumes:
      - ims-hss-certs:/certs
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket,ssl; c=ssl.create_default_context(cafile='/certs/hss.crt'); s=c.wrap_socket(socket.create_connection(('127.0.0.1',3868),0.5),server_hostname='hss'); s.close()"]
      interval: 2s
      timeout: 2s
      retries: 20

  media:
    build:
      context: .
      dockerfile: docker/ims-lab/Dockerfile.media
    command:
      - --control-host
      - 0.0.0.0
      - --control-port
      - "2223"
      - --control-allow
      - 172.30.0.4,127.0.0.1
      - --media-bind
      - 0.0.0.0
      - --media-ip
      - 172.30.0.3
      - --media-min
      - "30000"
      - --media-max
      - "30127"
      - --max-sessions
      - "128"
      - --session-timeout
      - "300"
    networks:
      ims-lab:
        ipv4_address: 172.30.0.3
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.socket(socket.AF_INET,socket.SOCK_DGRAM); s.settimeout(.5); s.sendto(b'ims-health d7:command4:pinge',('127.0.0.1',2223)); r,_=s.recvfrom(1024); s.close(); assert b'6:result2:ok' in r"]
      interval: 2s
      timeout: 2s
      retries: 20

  madis:
    build:
      context: .
      dockerfile: docker/ims-lab/Dockerfile.madis
      args:
        MAKO_VERSION: "0.4.18"
    depends_on:
      hss:
        condition: service_healthy
      media:
        condition: service_healthy
    volumes:
      - ims-hss-certs:/certs:ro
    environment:
      SIP_BIND_IP: 0.0.0.0
      SIP_IPV6: "0"
      SIP_UDP_PORT: "5060"
      SIP_TCP_PORT: "5060"
      SIP_ADMIN_PORT: "8080"
      SIP_ADMIN_TOKEN: ims-docker-admin-token-123456
      SIP_REALM: example.com
      SIP_NODE_ID: ims-docker-scscf
      SIP_NODE_ADDR: 172.30.0.4
      SIP_DIAMETER_HOST: hss
      SIP_DIAMETER_PORT: "3868"
      SIP_DIAMETER_TLS: "1"
      SIP_DIAMETER_ALLOW_PLAINTEXT: "0"
      SIP_DIAMETER_CA: /certs/hss.crt
      SIP_DIAMETER_ORIGIN_HOST: scscf.docker
      SIP_DIAMETER_ORIGIN_REALM: example.com
      SIP_DIAMETER_DEST_REALM: example.com
      SIP_IMS_CX: "1"
      SIP_IMS_AKA: "1"
      SIP_IMS_AKA_SCHEME: Digest-AKAv1-MD5
      SIP_IMS_ROLE: scscf
      SIP_IMS_VISITED_NETWORK: example.com
      SIP_IMS_SERVER_NAME: sip:scscf.example.com
      SIP_IMS_DEST_HOST: hss
      SIP_IMS_SESSION: "1"
      SIP_RTPENGINE_ENABLED: "1"
      SIP_RTPENGINE_HOST: media
      SIP_RTPENGINE_PORT: "2223"
    ports:
      - "127.0.0.1:15060:5060/udp"
      - "127.0.0.1:18080:8080/tcp"
    networks:
      ims-lab:
        ipv4_address: 172.30.0.4
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H 'Authorization: Bearer ims-docker-admin-token-123456' http://127.0.0.1:8080/healthz >/dev/null"]
      interval: 2s
      timeout: 2s
      retries: 30

  client:
    build:
      context: .
      dockerfile: docker/ims-lab/Dockerfile.client
    depends_on:
      madis:
        condition: service_healthy
      hss:
        condition: service_healthy
      media:
        condition: service_healthy
    environment:
      MADIS_HOST: madis
      MADIS_SIP_PORT: "5060"
      CLIENT_MEDIA_IP: 172.30.0.5
    networks:
      ims-lab:
        ipv4_address: 172.30.0.5

volumes:
  ims-hss-certs:

networks:
  ims-lab:
    name: madis-ims-lab
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
