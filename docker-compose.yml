services:
  madis:
    build: .
    container_name: madis
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5060:5060/udp"
      - "5060:5060/tcp"
      - "5061:5061/tcp"
      - "8443:8443/tcp"
      - "127.0.0.1:8080:8080/tcp"
    environment:
      SIP_DB_URL: "postgres://madis:${MADIS_DB_PASS:?MADIS_DB_PASS must be set}@db:5432/madis"
      SIP_UDP_PORT: "5060"
      SIP_TLS_PORT: "5061"
      SIP_WSS_PORT: "8443"
      SIP_ADMIN_PORT: "8080"
      SIP_ADMIN_TOKEN: "${MADIS_ADMIN_TOKEN:?MADIS_ADMIN_TOKEN must be set}"
      SIP_CARRIER_API_TOKEN: "${MADIS_CARRIER_API_TOKEN:?MADIS_CARRIER_API_TOKEN must be set}"
      SIP_CONTROL_API_TOKEN: "${MADIS_CONTROL_API_TOKEN:?MADIS_CONTROL_API_TOKEN must be set}"
      SIP_CONTROL_API_READ_TOKEN: "${MADIS_CONTROL_API_READ_TOKEN:?MADIS_CONTROL_API_READ_TOKEN must be set}"
      SIP_APP_TOKEN: "${MADIS_APP_TOKEN:-}"
      SIP_MODULE_TOKEN: "${MADIS_MODULE_TOKEN:-}"
      SIP_APP_URL: "${MADIS_APP_URL:-}"
      SIP_MODULE_URL: "${MADIS_MODULE_URL:-}"
      SIP_BILLING_MODE: "${MADIS_BILLING_MODE:-outbox}"
      SIP_BILLING_TENANT: "${MADIS_BILLING_TENANT:-default}"
      SIP_CHARGING_PROTOCOL: "${MADIS_CHARGING_PROTOCOL:-http}"
      SIP_DIAMETER_TLS: "${MADIS_DIAMETER_TLS:-1}"
      SIP_DIAMETER_PERSISTENT: "${MADIS_DIAMETER_PERSISTENT:-0}"
      SIP_IMS_CX: "${MADIS_IMS_CX:-0}"
      SIP_IMS_ROLE: "${MADIS_IMS_ROLE:-scscf}"
      SIP_IMS_SESSION: "${MADIS_IMS_SESSION:-0}"
      SIP_IMS_PCSCF_NEXT_HOP: "${MADIS_IMS_PCSCF_NEXT_HOP:-}"
      SIP_IMS_ICSCF_NEXT_HOP: "${MADIS_IMS_ICSCF_NEXT_HOP:-}"
      SIP_IMS_AKA: "${MADIS_IMS_AKA:-0}"
      SIP_IMS_AKA_SCHEME: "${MADIS_IMS_AKA_SCHEME:-Digest-AKAv1-MD5}"
      SIP_IMS_VISITED_NETWORK: "${MADIS_IMS_VISITED_NETWORK:-}"
      SIP_IMS_SERVER_NAME: "${MADIS_IMS_SERVER_NAME:-}"
      SIP_IMS_DEST_HOST: "${MADIS_IMS_DEST_HOST:-}"
      SIP_IMS_SUBSCRIBER_URL: "${MADIS_IMS_SUBSCRIBER_URL:-}"
      SIP_IMS_SUBSCRIBER_TOKEN: "${MADIS_IMS_SUBSCRIBER_TOKEN:-}"
      SIP_IMS_SUBSCRIBER_CA: "${MADIS_IMS_SUBSCRIBER_CA:-}"
      SIP_IMS_SUBSCRIBER_TIMEOUT_MS: "${MADIS_IMS_SUBSCRIBER_TIMEOUT_MS:-250}"
      SIP_BIND_IP: "0.0.0.0"
      SIP_IPV6: "0"
      SIP_REALM: "${MADIS_REALM:-madis.local}"
      SIP_NODE_ID: "${MADIS_NODE_ID:-docker-node1}"
      SIP_NODE_ADDR: "${MADIS_NODE_ADDR:-127.0.0.1}"
      SIP_DIGEST_ALGORITHM: "md5"
      SIP_UDP_WORKERS: "${MADIS_UDP_WORKERS:-1}"
      SIP_TCP_WORKERS: "${MADIS_TCP_WORKERS:-1}"
      SIP_SCHED_WORKERS: "${MADIS_SCHED_WORKERS:-0}"
      SIP_TCP_MAX_CONNECTIONS: "${MADIS_TCP_MAX_CONNECTIONS:-65536}"
      SIP_CALL_STATE_CAPACITY: "${MADIS_CALL_STATE_CAPACITY:-262144}"
      SIP_HEP_ENABLE: "${MADIS_HEP_ENABLE:-0}"
      SIP_HEP_HOST: "${MADIS_HEP_HOST:-}"
      SIP_HEP_PORT: "${MADIS_HEP_PORT:-9060}"
      SIP_HEP_CAPTURE_ID: "${MADIS_HEP_CAPTURE_ID:-1}"
      SIP_HEP_MAX_PAYLOAD: "${MADIS_HEP_MAX_PAYLOAD:-60000}"
      SIP_HEP_QUEUE_CAPACITY: "${MADIS_HEP_QUEUE_CAPACITY:-8192}"
      SIP_MAX_REG_EXPIRES: "3600"
      SIP_MIN_EXPIRES: "60"
    networks:
      - madis-net

  db:
    image: postgres:16-alpine
    container_name: madis-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: madis
      POSTGRES_USER: madis
      POSTGRES_PASSWORD: "${MADIS_DB_PASS:?MADIS_DB_PASS must be set}"
    volumes:
      - madis-pgdata:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U madis"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - madis-net

volumes:
  madis-pgdata:

networks:
  madis-net:
    driver: bridge
