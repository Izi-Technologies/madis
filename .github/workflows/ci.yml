name: madis-ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Madis
        uses: actions/checkout@v4

      - name: Checkout pinned Mako compiler
        uses: actions/checkout@v4
        with:
          repository: loreste/mako
          ref: c2a2d38212903b981f967c7023c5fe07744e1d71 # Makori 0.6.38 + ownership fixes (#74–#77)
          path: .ci/mako

      - name: Build Mako
        run: cargo build --release --locked --manifest-path .ci/mako/Cargo.toml

      - name: Run Madis checks
        env:
          MAKO_BIN: ${{ github.workspace }}/.ci/mako/target/release/mako
          MAKO_RUNTIME: ${{ github.workspace }}/.ci/mako/runtime
        run: ./scripts/ci.sh
      - name: Check Makori ownership under sanitizers
        timeout-minutes: 10
        env:
          MAKO_BIN: ${{ github.workspace }}/.ci/mako/target/release/mako
          MAKO_RUNTIME: ${{ github.workspace }}/.ci/mako/runtime
        run: bash scripts/check-ownership.sh

      - name: Check framing benchmark and generated result type
        env:
          MAKO_BIN: ${{ github.workspace }}/.ci/mako/target/release/mako
          MAKO_RUNTIME: ${{ github.workspace }}/.ci/mako/runtime
        run: python3 bench/stream_framing.py --runs 1 --batches 3 --iterations 100 --output "$RUNNER_TEMP/framing-benchmark.json"

      # IMS end-to-end smoke tests require a built worker binary, Diameter
      # peer, and HSS test double. Run locally with:
      #   ./scripts/lab-smoke.sh e2e
      #   ./scripts/lab-smoke.sh docker
