name: madis-ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Madis
        uses: actions/checkout@v4

      - name: Checkout pinned Mako compiler
        uses: actions/checkout@v4
        with:
          repository: loreste/mako
          ref: 45c8e61a94a13dce9f01c3c913a6a5f28610ce8c # Makori 0.6.34
          path: .ci/mako

      - name: Build Mako
        run: cargo build --release --manifest-path .ci/mako/Cargo.toml

      - name: Run Madis checks
        env:
          MAKO_BIN: ${{ github.workspace }}/.ci/mako/target/release/mako
          MAKO_RUNTIME: ${{ github.workspace }}/.ci/mako/runtime
        run: ./scripts/ci.sh
      - name: Check Makori ownership under sanitizers
        timeout-minutes: 10
        env:
          MAKO_BIN: ${{ github.workspace }}/.ci/mako/target/release/mako
          MAKO_RUNTIME: ${{ github.workspace }}/.ci/mako/runtime
        run: bash scripts/check-ownership.sh

      # IMS end-to-end smoke tests require a built worker binary, Diameter
      # peer, and HSS test double. Run locally with:
      #   ./scripts/lab-smoke.sh e2e
      #   ./scripts/lab-smoke.sh docker
